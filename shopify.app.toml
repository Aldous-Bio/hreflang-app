# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "172fdeccd8b68f8e1040056ce297d5c6"
name = "Hreflang App"
application_url = "https://hreflang.apps.aldous-server.com"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products,write_content,write_metaobjects,write_metaobject_definitions"

[product.metafields.app.demo_info]
type = "single_line_text_field"
name = "Demo Source Info"
description = "Tracks products created by the Shopify app template for development"

  [product.metafields.app.demo_info.access]
  admin = "merchant_read_write"

[metaobjects.app.example]
name = "Example"
description = "An example metaobject definition created by this template"

  [metaobjects.app.example.access]
  admin = "merchant_read_write"

[metaobjects.app.example.fields.title]
name = "Title"
type = "single_line_text_field"
required = true

[metaobjects.app.example.fields.description]
name = "Description"
type = "multi_line_text_field"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/products"
  topics = [ "products/create", "products/update", "products/delete" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/collections"
  topics = [ "collections/create", "collections/update", "collections/delete" ]

  # Shopify no ofrece webhooks de create/update/delete para Page ni Article
  # (los topics REST clásicos pages/* y articles/* no tienen equivalente desde
  # que se migraron a los tipos GraphQL Page/Article en la API 2024-10). El
  # matching automático en tiempo real solo cubre productos y colecciones;
  # páginas y artículos necesitarían una sincronización manual/periódica aparte.

[auth]
redirect_urls = [ "https://hreflang.apps.aldous-server.com/api/auth" ]

[build]
automatically_update_urls_on_dev = true
